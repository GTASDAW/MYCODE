services:
  mysql:
    image: mysql:26.7.0@sha256:625f74ddf93652d9d0f8d4ea7d741b9189554a5e96d27bb770abd0902d89c6e3
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-activity_platform}
      MYSQL_USER: ${MYSQL_USER:-activity}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-activity_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_mysql_root_password}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-activity_platform}?characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USERNAME: ${MYSQL_USER:-activity}
      DB_PASSWORD: ${MYSQL_PASSWORD:-activity_dev_password}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-Admin123!}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-Demo123!}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      INSTANCE_ID: ${INSTANCE_ID:-local}
      AMAP_JS_KEY: ${AMAP_JS_KEY:-}
      AMAP_JS_SECURITY_CODE: ${AMAP_JS_SECURITY_CODE:-}
      AMAP_WEB_SERVICE_KEY: ${AMAP_WEB_SERVICE_KEY:-}
      AUTH_RATE_LIMIT_LOGIN_SOURCE_LIMIT: ${AUTH_RATE_LIMIT_LOGIN_SOURCE_LIMIT:-60}
      AUTH_RATE_LIMIT_LOGIN_SOURCE_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_LOGIN_SOURCE_WINDOW_SECONDS:-60}
      AUTH_RATE_LIMIT_LOGIN_PAIR_LIMIT: ${AUTH_RATE_LIMIT_LOGIN_PAIR_LIMIT:-10}
      AUTH_RATE_LIMIT_LOGIN_PAIR_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_LOGIN_PAIR_WINDOW_SECONDS:-60}
      AUTH_RATE_LIMIT_REGISTER_SOURCE_LIMIT: ${AUTH_RATE_LIMIT_REGISTER_SOURCE_LIMIT:-5}
      AUTH_RATE_LIMIT_REGISTER_SOURCE_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_REGISTER_SOURCE_WINDOW_SECONDS:-600}
      AUTH_RATE_LIMIT_PASSWORD_ACCOUNT_LIMIT: ${AUTH_RATE_LIMIT_PASSWORD_ACCOUNT_LIMIT:-5}
      AUTH_RATE_LIMIT_PASSWORD_ACCOUNT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_PASSWORD_ACCOUNT_WINDOW_SECONDS:-600}
      AUTH_RATE_LIMIT_PASSWORD_SOURCE_LIMIT: ${AUTH_RATE_LIMIT_PASSWORD_SOURCE_LIMIT:-20}
      AUTH_RATE_LIMIT_PASSWORD_SOURCE_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_PASSWORD_SOURCE_WINDOW_SECONDS:-600}
      AUTH_RATE_LIMIT_MAX_BUCKETS: ${AUTH_RATE_LIMIT_MAX_BUCKETS:-10000}
      AUTH_RATE_LIMIT_NAMESPACE: ${AUTH_RATE_LIMIT_NAMESPACE:-gather:auth-rate-limit}
      AUTH_RATE_LIMIT_TRUSTED_PROXY_IPS: ${AUTH_RATE_LIMIT_TRUSTED_PROXY_IPS:-}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:${APP_PORT:-8088}:80"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  mysql-data:
