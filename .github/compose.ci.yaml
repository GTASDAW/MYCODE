# Only for an isolated CI project. The application still uses the real Compose stack.
services:
  mysql:
    ports:
      - "127.0.0.1:33306:3306"
  backend:
    # Ordinary regressions intentionally use generous, enabled limits. The
    # dedicated checker recreates only this isolated service with strict limits.
    environment:
      AUTH_RATE_LIMIT_LOGIN_SOURCE_LIMIT: ${AUTH_RATE_LIMIT_LOGIN_SOURCE_LIMIT:-10000}
      AUTH_RATE_LIMIT_LOGIN_SOURCE_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_LOGIN_SOURCE_WINDOW_SECONDS:-60}
      AUTH_RATE_LIMIT_LOGIN_PAIR_LIMIT: ${AUTH_RATE_LIMIT_LOGIN_PAIR_LIMIT:-1000}
      AUTH_RATE_LIMIT_LOGIN_PAIR_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_LOGIN_PAIR_WINDOW_SECONDS:-60}
      AUTH_RATE_LIMIT_REGISTER_SOURCE_LIMIT: ${AUTH_RATE_LIMIT_REGISTER_SOURCE_LIMIT:-10000}
      AUTH_RATE_LIMIT_REGISTER_SOURCE_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_REGISTER_SOURCE_WINDOW_SECONDS:-600}
      AUTH_RATE_LIMIT_MAX_BUCKETS: ${AUTH_RATE_LIMIT_MAX_BUCKETS:-10000}
      AUTH_RATE_LIMIT_NAMESPACE: ${AUTH_RATE_LIMIT_NAMESPACE:-gather:auth-rate-limit-ci}
      AUTH_RATE_LIMIT_TRUSTED_PROXY_IPS: ${AUTH_RATE_LIMIT_TRUSTED_PROXY_IPS:-}
