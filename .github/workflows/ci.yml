name: Build, test and verify Compose

on:
  push:
    paths-ignore: ['docs/**', 'README.md', 'AGENTS.md']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', 'AGENTS.md']
  workflow_dispatch:
    inputs:
      redis_all_e2e:
        description: 'Release/deep verification: repeat all browser cases against Redis'
        type: boolean
        default: false
  schedule:
    # Daily at 02:00 Asia/Shanghai; manual verification is required before release.
    - cron: '0 18 * * *'

permissions:
  contents: read

concurrency:
  group: gather-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Select fast or full verification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
      redis_all: ${{ steps.scope.outputs.redis_all }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - id: scope
        run: node scripts/ci-scope.mjs

  container-images:
    name: Build reusable ${{ matrix.image }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: backend
          - image: web
            context: frontend
    env:
      DOCKER_BUILD_RECORD_RETENTION_DAYS: '7'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.0
          driver-opts: image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
      - name: Build once and export the exact revision
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.context }}
          platforms: linux/amd64
          tags: gather-ci-${{ matrix.image }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/${{ matrix.image }}.tar
          cache-from: type=gha,version=2,scope=gather-${{ matrix.image }}
          cache-to: type=gha,version=2,scope=gather-${{ matrix.image }},mode=max
      - name: Share this run's image with isolated verification jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gather-ci-image-${{ matrix.image }}
          path: ${{ runner.temp }}/${{ matrix.image }}.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            package-lock.json
      - name: Install, test and build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime/ci
          npm ci --prefix frontend 2>&1 | tee .runtime/ci/frontend-install.log
          npm test --prefix frontend 2>&1 | tee .runtime/ci/frontend-tests.log
          npm run build --prefix frontend 2>&1 | tee .runtime/ci/frontend-build.log
      - name: Verify fixed production loading baseline and current module boundaries
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/frontend-loading.test.mjs 2>&1 | tee .runtime/ci/frontend-loading-tools.log
          npm run build:loading 2>&1 | tee .runtime/ci/frontend-loading-build.log
          npm run check:loading 2>&1 | tee .runtime/ci/frontend-loading-contract.log
      - name: Verify CI image reuse and quality gate contracts
        run: |
          npm ci
          node --test scripts/ci-images.test.mjs
          node --test scripts/ci-scope.test.mjs
          node --test scripts/ci-suites.test.mjs
          npm run check:e2e:types
          npm run test:backup
      - name: Preserve frontend diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-diagnostics
          path: |
            .runtime/ci/frontend-*.log
            .runtime/frontend-loading/contract.json
            .runtime/frontend-loading/comparison.md
            .runtime/frontend-loading/baseline/build.json
            .runtime/frontend-loading/after/build.json
          include-hidden-files: true
          retention-days: 7

  backend:
    name: Backend tests on MySQL 8.4
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4.11@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
        env:
          MYSQL_DATABASE: activity_platform_test
          MYSQL_USER: activity
          MYSQL_PASSWORD: activity_ci_password
          MYSQL_ROOT_PASSWORD: ci_mysql_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="MYSQL_PWD=activity_ci_password mysql -h 127.0.0.1 -u activity activity_platform_test -e 'SELECT 1'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/activity_platform_test?characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      TEST_DB_USERNAME: activity
      TEST_DB_PASSWORD: activity_ci_password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Build and run real database regressions
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../.runtime/ci
          sh ./mvnw -B verify 2>&1 | tee ../.runtime/ci/backend-verify.log
      - name: Preserve backend diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-diagnostics
          path: |
            .runtime/ci/backend-verify.log
            .runtime/category-query-evidence.md
            backend/target/surefire-reports/
          retention-days: 7

  compose-e2e:
    name: Compose, restart and browser verification
    needs: [scope, frontend, backend, container-images]
    runs-on: ubuntu-24.04
    # Full browser, loading, auth recovery, diagnostics and cleanup share this budget.
    timeout-minutes: 45
    env:
      CI_BACKEND_IMAGE: gather-ci-backend:${{ github.sha }}
      CI_WEB_IMAGE: gather-ci-web:${{ github.sha }}
      COMPOSE_PROJECT_NAME: gather-ci
      MYSQL_DATABASE: activity_platform_e2e
      MYSQL_USER: activity
      MYSQL_PASSWORD: activity_ci_password
      MYSQL_ROOT_PASSWORD: ci_mysql_root_password
      APP_PORT: '18088'
      SESSION_COOKIE_SECURE: 'false'
      DEMO_ADMIN_PASSWORD: Admin123!
      DEMO_USER_PASSWORD: Demo123!
      E2E_BASE_URL: http://127.0.0.1:18088
      E2E_DB_HOST: 127.0.0.1
      E2E_DB_PORT: '33306'
      E2E_DB_NAME: activity_platform_e2e
      E2E_DB_USERNAME: activity
      E2E_DB_PASSWORD: activity_ci_password
      SMOKE_RESTART_BACKEND: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install browser checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime/ci
          npm ci 2>&1 | tee .runtime/ci/e2e-install.log
          npm run test:cleanup 2>&1 | tee .runtime/ci/cleanup-safety-tests.log
          node --test scripts/auth-rate-limit-check.test.mjs 2>&1 | tee .runtime/ci/auth-rate-limit-safety.log
          npx playwright install --with-deps chromium 2>&1 | tee .runtime/ci/browser-install.log
      - name: Download this run's reusable container images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gather-ci-image-*
          path: ${{ runner.temp }}/gather-ci-images
          merge-multiple: true
      - name: Load and verify this revision's images
        shell: bash
        run: |
          set -euo pipefail
          docker load --input "$RUNNER_TEMP/gather-ci-images/backend.tar" 2>&1 | tee .runtime/ci/images-load.log
          docker load --input "$RUNNER_TEMP/gather-ci-images/web.tar" 2>&1 | tee -a .runtime/ci/images-load.log
          for image in "$CI_BACKEND_IMAGE" "$CI_WEB_IMAGE"; do
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")" = "$GITHUB_SHA"
            docker image inspect --format '{{.RepoTags}} {{.Id}}' "$image" >> .runtime/ci/images-load.log
          done
      - name: Start isolated stack from verified images
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f compose.yaml -f .github/compose.ci.yaml config --quiet
          docker compose -f compose.yaml -f .github/compose.ci.yaml up --no-build -d --wait --wait-timeout 180 2>&1 | tee .runtime/ci/compose-start.log
      - name: Verify migrations, deep links and backend restart
        shell: bash
        run: |
          set -euo pipefail
          node scripts/compose-smoke.mjs 2>&1 | tee .runtime/ci/compose-smoke.log
      - name: Run fast desktop and mobile smoke flows
        if: needs.scope.outputs.full != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run test:e2e:smoke 2>&1 | tee .runtime/ci/browser-smoke.log
      - name: Run all desktop and mobile flows
        if: needs.scope.outputs.full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run test:e2e 2>&1 | tee .runtime/ci/browser-tests.log
      - name: Verify production route loading, recovery and Nginx cache contracts
        if: needs.scope.outputs.full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime/ci/loading-dist
          docker compose -f compose.yaml -f .github/compose.ci.yaml cp web:/usr/share/nginx/html/.vite .runtime/ci/loading-dist/.vite
          LOADING_BASE_URL="$E2E_BASE_URL" LOADING_BUILD_PATH=.runtime/ci/loading-dist/.vite/loading-graph.json LOADING_DIST_PATH=.runtime/ci/loading-dist LOADING_OUTPUT_DIR=.runtime/ci/loading-browser-results LOADING_REPORT_DIR=.runtime/ci/loading-browser-report npm run test:loading 2>&1 | tee .runtime/ci/loading-browser.log
      - name: Verify strict in-memory auth limits and real browser recovery
        if: needs.scope.outputs.full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          AUTH_RATE_LIMIT_TEST_MODE=memory node scripts/auth-rate-limit-check.mjs 2>&1 | tee .runtime/ci/auth-rate-limit-memory.log
      - name: Retry exact run cleanup if the browser step was interrupted
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for manifest in .runtime/e2e/*.json; do
            node scripts/e2e-cleanup.mjs "$manifest" 2>&1 | tee -a .runtime/ci/e2e-cleanup.log
          done
      - name: Collect container diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p .runtime/ci
          docker compose -f compose.yaml -f .github/compose.ci.yaml ps --all > .runtime/ci/compose-status.log 2>&1
          docker compose -f compose.yaml -f .github/compose.ci.yaml logs --no-color > .runtime/ci/compose-services.log 2>&1
      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compose-browser-diagnostics
          path: |
            .runtime/ci/
            .runtime/e2e/
            playwright-report/
            test-results/
          include-hidden-files: true
          retention-days: 7
      - name: Remove only this isolated CI stack
        if: always()
        run: docker compose -f compose.yaml -f .github/compose.ci.yaml down --volumes --remove-orphans

  redis-session:
    name: Redis shared Session on two backends
    needs: [scope, frontend, backend, container-images]
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI_BACKEND_IMAGE: gather-ci-backend:${{ github.sha }}
      CI_WEB_IMAGE: gather-ci-web:${{ github.sha }}
      COMPOSE_PROJECT_NAME: gather-redis-ci
      MYSQL_DATABASE: activity_platform_e2e
      MYSQL_USER: activity
      MYSQL_PASSWORD: activity_ci_password
      MYSQL_ROOT_PASSWORD: ci_mysql_root_password
      REDIS_PASSWORD: ci_redis_password
      SESSION_NAMESPACE: gather:session
      SESSION_TIMEOUT: 30m
      APP_PORT: '19088'
      SESSION_COOKIE_SECURE: 'false'
      DEMO_ADMIN_PASSWORD: Admin123!
      DEMO_USER_PASSWORD: Demo123!
      E2E_BASE_URL: http://127.0.0.1:19088
      E2E_DB_HOST: 127.0.0.1
      E2E_DB_PORT: '33306'
      E2E_DB_NAME: activity_platform_e2e
      E2E_DB_USERNAME: activity
      E2E_DB_PASSWORD: activity_ci_password
      REDIS_TEST_BASE_URL: http://127.0.0.1:19088
      REDIS_TEST_A_URL: http://127.0.0.1:19081
      REDIS_TEST_B_URL: http://127.0.0.1:19082
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install verification tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime/ci
          npm ci 2>&1 | tee .runtime/ci/redis-install.log
          npm run test:cleanup 2>&1 | tee .runtime/ci/redis-cleanup-safety.log
          node --test scripts/redis-session-check.test.mjs 2>&1 | tee .runtime/ci/redis-lifecycle-safety.log
          node --test scripts/auth-rate-limit-check.test.mjs 2>&1 | tee .runtime/ci/redis-auth-rate-limit-safety.log
          npx playwright install --with-deps chromium 2>&1 | tee .runtime/ci/redis-browser-install.log
      - name: Download this run's reusable container images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gather-ci-image-*
          path: ${{ runner.temp }}/gather-ci-images
          merge-multiple: true
      - name: Load and verify this revision's images
        shell: bash
        run: |
          set -euo pipefail
          docker load --input "$RUNNER_TEMP/gather-ci-images/backend.tar" 2>&1 | tee .runtime/ci/images-load.log
          docker load --input "$RUNNER_TEMP/gather-ci-images/web.tar" 2>&1 | tee -a .runtime/ci/images-load.log
          for image in "$CI_BACKEND_IMAGE" "$CI_WEB_IMAGE"; do
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")" = "$GITHUB_SHA"
            docker image inspect --format '{{.RepoTags}} {{.Id}}' "$image" >> .runtime/ci/images-load.log
          done
      - name: Start two shared-session replicas from verified images
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f compose.yaml -f compose.redis.yaml -f .github/compose.ci.yaml -f .github/compose.redis-ci.yaml config --quiet
          docker compose -f compose.yaml -f compose.redis.yaml -f .github/compose.ci.yaml -f .github/compose.redis-ci.yaml up --no-build -d --wait --wait-timeout 180 2>&1 | tee .runtime/ci/redis-compose-start.log
      - name: Verify shared identity, CSRF, restart, logout and real idle expiration
        shell: bash
        run: |
          set -euo pipefail
          node scripts/redis-session-check.mjs 2>&1 | tee .runtime/ci/redis-session-check.log
      - name: Run real browser flows through both replicas
        if: needs.scope.outputs.redis_all != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run test:e2e:redis 2>&1 | tee .runtime/ci/redis-browser-tests.log
      - name: Run every browser case through Redis for release or deep verification
        if: needs.scope.outputs.redis_all == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run test:e2e 2>&1 | tee .runtime/ci/redis-browser-tests.log
      - name: Verify production loading and cache recovery through shared-session Nginx
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime/ci/loading-dist
          docker compose -f compose.yaml -f compose.redis.yaml -f .github/compose.ci.yaml -f .github/compose.redis-ci.yaml cp web:/usr/share/nginx/html/.vite .runtime/ci/loading-dist/.vite
          LOADING_BASE_URL="$E2E_BASE_URL" LOADING_BUILD_PATH=.runtime/ci/loading-dist/.vite/loading-graph.json LOADING_DIST_PATH=.runtime/ci/loading-dist LOADING_OUTPUT_DIR=.runtime/ci/loading-browser-results LOADING_REPORT_DIR=.runtime/ci/loading-browser-report npm run test:loading 2>&1 | tee .runtime/ci/redis-loading-browser.log
      - name: Verify strict shared auth limits on both replicas and real browser recovery
        shell: bash
        run: |
          set -euo pipefail
          AUTH_RATE_LIMIT_TEST_MODE=redis node scripts/auth-rate-limit-check.mjs 2>&1 | tee .runtime/ci/auth-rate-limit-redis.log
      - name: Retry only owned browser fixture cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for manifest in .runtime/e2e/*.json; do
            node scripts/e2e-cleanup.mjs "$manifest" 2>&1 | tee -a .runtime/ci/redis-e2e-cleanup.log
          done
      - name: Collect shared-session container diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p .runtime/ci
          docker compose -f compose.yaml -f compose.redis.yaml -f .github/compose.ci.yaml -f .github/compose.redis-ci.yaml ps --all > .runtime/ci/redis-compose-status.log 2>&1
          docker compose -f compose.yaml -f compose.redis.yaml -f .github/compose.ci.yaml -f .github/compose.redis-ci.yaml logs --no-color > .runtime/ci/redis-compose-services.log 2>&1
      - name: Preserve shared-session verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: redis-session-diagnostics
          path: |
            .runtime/ci/
            .runtime/e2e/
            playwright-report/
            test-results/
          include-hidden-files: true
          retention-days: 7
      - name: Remove only the isolated shared-session CI stack
        if: always()
        run: docker compose -f compose.yaml -f compose.redis.yaml -f .github/compose.ci.yaml -f .github/compose.redis-ci.yaml down --volumes --remove-orphans

  performance:
    name: Signup HTTP performance baseline
    needs: [scope, frontend, backend, container-images]
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI_BACKEND_IMAGE: gather-ci-backend:${{ github.sha }}
      CI_WEB_IMAGE: gather-ci-web:${{ github.sha }}
      COMPOSE_PROJECT_NAME: gather-perf-ci
      MYSQL_DATABASE: activity_platform_perf
      MYSQL_USER: activity
      MYSQL_PASSWORD: activity_ci_password
      MYSQL_ROOT_PASSWORD: ci_mysql_root_password
      APP_PORT: '18098'
      SESSION_COOKIE_SECURE: 'false'
      DEMO_ADMIN_PASSWORD: Admin123!
      DEMO_USER_PASSWORD: Demo123!
      PERF_BASE_URL: http://127.0.0.1:18098
      PERF_DB_HOST: 127.0.0.1
      PERF_DB_PORT: '33306'
      PERF_DB_NAME: activity_platform_perf
      PERF_DB_USERNAME: activity
      PERF_DB_PASSWORD: activity_ci_password
      PERF_CPU_LIMIT: '2'
      PERF_MEMORY_LIMIT: 1024m
      PERF_APP_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install and verify measurement safety
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime/ci
          npm ci 2>&1 | tee .runtime/ci/performance-install.log
          npm run test:performance-safety 2>&1 | tee .runtime/ci/performance-safety.log
      - name: Download this run's reusable container images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gather-ci-image-*
          path: ${{ runner.temp }}/gather-ci-images
          merge-multiple: true
      - name: Load and verify this revision's images
        shell: bash
        run: |
          set -euo pipefail
          docker load --input "$RUNNER_TEMP/gather-ci-images/backend.tar" 2>&1 | tee .runtime/ci/performance-images-load.log
          docker load --input "$RUNNER_TEMP/gather-ci-images/web.tar" 2>&1 | tee -a .runtime/ci/performance-images-load.log
          for image in "$CI_BACKEND_IMAGE" "$CI_WEB_IMAGE"; do
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")" = "$GITHUB_SHA"
            docker image inspect --format '{{.RepoTags}} {{.Id}}' "$image" >> .runtime/ci/performance-images-load.log
          done
      - name: Start a separate stack with fixed resource limits from verified images
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f compose.yaml -f .github/compose.ci.yaml -f .github/compose.perf-ci.yaml config --quiet
          docker compose -f compose.yaml -f .github/compose.ci.yaml -f .github/compose.perf-ci.yaml up --no-build -d --wait --wait-timeout 180 2>&1 | tee .runtime/ci/performance-compose-start.log
          docker compose -f compose.yaml -f .github/compose.ci.yaml -f .github/compose.perf-ci.yaml exec -T backend java -version > .runtime/ci/performance-java-version.log 2>&1
      - name: Measure signup latency, throughput and database invariants
        shell: bash
        run: |
          set -euo pipefail
          export PERF_JAVA_VERSION="$(head -n 1 .runtime/ci/performance-java-version.log)"
          npm run check:performance 2>&1 | tee .runtime/ci/performance-run.log
          cat .runtime/ci/performance.md >> "$GITHUB_STEP_SUMMARY"
      - name: Collect isolated performance diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p .runtime/ci
          docker compose -f compose.yaml -f .github/compose.ci.yaml -f .github/compose.perf-ci.yaml ps --all > .runtime/ci/performance-compose-status.log 2>&1
          docker compose -f compose.yaml -f .github/compose.ci.yaml -f .github/compose.perf-ci.yaml logs --no-color > .runtime/ci/performance-services.log 2>&1
      - name: Preserve actual measurement and cleanup evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signup-performance-baseline
          path: |
            .runtime/ci/performance*
            .runtime/performance/
          include-hidden-files: true
          retention-days: 7
      - name: Remove only the isolated performance CI stack
        if: always()
        run: docker compose -f compose.yaml -f .github/compose.ci.yaml -f .github/compose.perf-ci.yaml down --volumes --remove-orphans

  quality-gate:
    name: CI quality gate
    if: always()
    needs: [scope, frontend, backend, container-images, compose-e2e, redis-session, performance]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Require every check selected by the risk policy
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci-scope.mjs verify
