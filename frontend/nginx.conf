server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location ~ "^/assets/.+-[A-Za-z0-9_-]{8,}\.[A-Za-z0-9]+$" {
        try_files $uri @missing_asset;
        # Apply only to successful content-addressed files, never missing chunks.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /assets/ {
        try_files $uri @missing_asset;
    }
    location @missing_asset {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 404 "Asset not found\n";
    }
    location /.vite/ {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 404 "Not found\n";
    }
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Gather-Client-IP $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
