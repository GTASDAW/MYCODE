upstream gather_backends {
    server backend:8080;
    server backend2:8080;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location /api/ {
        proxy_pass http://gather_backends;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Local multi-instance demonstrations and CI can prove both replicas serve requests.
        add_header X-Gather-Backend $upstream_addr always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
