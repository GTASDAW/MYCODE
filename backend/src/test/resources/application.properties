# Ordinary regression contexts remain rate-limited at explicit test-only high limits.
# AuthRateLimitIntegrationTest overrides these with small, enforceable windows.
app.auth-rate-limit.login-source-limit=100000
app.auth-rate-limit.login-pair-limit=100000
app.auth-rate-limit.register-source-limit=100000
app.auth-rate-limit.password-account-limit=100000
app.auth-rate-limit.password-source-limit=100000
