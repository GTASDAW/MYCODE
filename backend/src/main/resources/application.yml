server:
  port: ${PORT:8080}
  # Client identity comes from the socket or an explicitly trusted dedicated proxy header.
  forward-headers-strategy: none
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        name: JSESSIONID
        path: /
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
spring:
  # Redis Session is an opt-in profile; the default servlet Session stays in memory.
  autoconfigure:
    exclude:
      - org.springframework.boot.session.data.redis.autoconfigure.SessionDataRedisAutoConfiguration
  application:
    name: gather-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/activity_platform?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:activity}
    password: ${DB_PASSWORD:activity_dev_password}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 10000
  flyway:
    enabled: true
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      base-path: /api
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  auth-rate-limit:
    login-source-limit: ${AUTH_RATE_LIMIT_LOGIN_SOURCE_LIMIT:60}
    login-source-window-seconds: ${AUTH_RATE_LIMIT_LOGIN_SOURCE_WINDOW_SECONDS:60}
    login-pair-limit: ${AUTH_RATE_LIMIT_LOGIN_PAIR_LIMIT:10}
    login-pair-window-seconds: ${AUTH_RATE_LIMIT_LOGIN_PAIR_WINDOW_SECONDS:60}
    register-source-limit: ${AUTH_RATE_LIMIT_REGISTER_SOURCE_LIMIT:5}
    register-source-window-seconds: ${AUTH_RATE_LIMIT_REGISTER_SOURCE_WINDOW_SECONDS:600}
    max-buckets: ${AUTH_RATE_LIMIT_MAX_BUCKETS:10000}
    namespace: ${AUTH_RATE_LIMIT_NAMESPACE:gather:auth-rate-limit}
    trusted-proxy-ips: ${AUTH_RATE_LIMIT_TRUSTED_PROXY_IPS:}
  instance-id: ${INSTANCE_ID:local}
  demo-seed-enabled: ${DEMO_SEED_ENABLED:true}
  demo-admin-password: ${DEMO_ADMIN_PASSWORD:Admin123!}
  demo-user-password: ${DEMO_USER_PASSWORD:Demo123!}
logging:
  structured:
    format:
      console: logstash
